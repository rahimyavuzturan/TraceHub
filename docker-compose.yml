services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tracehub-postgres
    environment:
      POSTGRES_USER: tracehub
      POSTGRES_PASSWORD: tracehub_dev_only
      POSTGRES_DB: tracehub
    ports:
      - "5433:5432"
    volumes:
      - tracehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracehub -d tracehub"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tracehub_pgdata:
